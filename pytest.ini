[pytest]
# Ignore directories
norecursedirs =
    node_modules
    experiments

# Test discovery paths
testpaths =
    qperformance/tests
    qopenremote/tests
    clockd/tests
    tests

# Test filename patterns
python_files =
    test_*.py
    *_test.py

# Python path configuration for imports
pythonpath =
    qopenremote/python-src
    qperformance
    clockd/tests

# Additional default options
addopts =
    -v
    --import-mode=importlib

# Live logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Environment variables (requires pytest-env plugin if used directly by pytest)
# Replace the path below with the actual location of your built test server executable
env =
    QOPENREMOTE_TEST_SERVER = /home/michael/talking-clock/build/Desktop_Qt_6_8_2-Debug/qopenremote/tests/qopenremote-ws-test-server
    CLOCKD_TEST_TARGET = /home/michael/talking-clock/build/Desktop_Qt_6_8_2-Debug/clockd/clockd
